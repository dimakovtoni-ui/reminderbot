<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#ff6fae">

    <title>Напоминания</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="background-decoration decoration-one"></div>
<div class="background-decoration decoration-two"></div>

<main class="container">

    <header class="hero">
        <div class="heart-badge">♥</div>
        <p class="eyebrow">твои маленькие планы</p>
        <h1>Привет, солнышко ❤️</h1>
        <p class="hero-text">Запиши всё важное, а я помогу ничего не забыть.</p>
    </header>

    <section class="memories" aria-label="Наши фотографии">
        <div class="memories-title">
            <span>немного нас</span>
            <span class="tiny-heart">♡</span>
        </div>

        <div class="photo-collage">
            <figure class="photo photo-main">
                <img src="2026-08-13 11.53.40.jpg" alt="Наша фотография" loading="eager">
            </figure>
            <figure class="photo photo-tall">
                <img src="2026-08-13 11.54.25.jpg" alt="Наша фотография" loading="lazy">
            </figure>
            <figure class="photo">
                <img src="2026-08-13 11.54.43.jpg" alt="Наша фотография" loading="lazy">
            </figure>
            <figure class="photo">
                <img src="2026-08-13 11.55.06.jpg" alt="Наша фотография" loading="lazy">
            </figure>
            <figure class="photo photo-tall">
                <img src="2026-08-13 11.55.27.jpg" alt="Наша фотография" loading="lazy">
            </figure>
            <figure class="photo photo-tall">
                <img src="2026-08-13 11.55.49.jpg" alt="Наша фотография" loading="lazy">
            </figure>
            <figure class="photo">
                <img src="2026-08-13 12.11.45.jpg" alt="Наша фотография" loading="lazy">
            </figure>
            <figure class="photo photo-wide">
                <img src="2026-08-13 12.12.04.jpg" alt="Наша фотография" loading="lazy">
            </figure>
        </div>
    </section>

    <div class="tabs">
        <button class="tab active" id="createTab">
            + Создать
        </button>

        <button class="tab" id="myRemindersTab">
            Мои напоминания
        </button>
    </div>

    <section id="createPage" class="page card">
        <div class="section-heading">
            <h2>Новое напоминание</h2>
            <span>♡</span>
        </div>

        <div class="reminder-form">
            <label for="reminderText">Что напомнить?</label>
            <input
                type="text"
                id="reminderText"
                placeholder="Например, позвонить маме"
                autocomplete="off"
            >

            <div class="date-time-grid">
                <div class="field-group">
                    <label for="reminderDate">Дата</label>
                    <input type="date" id="reminderDate">
                </div>

                <div class="field-group">
                    <label for="reminderTime">Время</label>
                    <input type="time" id="reminderTime">
                </div>
            </div>

            <button id="saveReminder">
                Создать напоминание ♥
            </button>
        </div>
    </section>

    <section id="remindersPage" class="page hidden">
        <div class="section-heading reminders-heading">
            <div>
                <p class="eyebrow">всё под контролем</p>
                <h2>Мои напоминания</h2>
            </div>
            <span>♥</span>
        </div>

        <div id="remindersList"></div>
    </section>

</main>

<script src="app.js"></script>

</body>
</html>
