<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Напоминания</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <h1>Напоминания 🔔</h1>

    <div class="tabs">
        <button class="tab active" id="createTab">
            + Создать
        </button>

        <button class="tab" id="myRemindersTab">
            Мои напоминания
        </button>
    </div>

    <!-- Создание напоминания -->
    <div id="createPage" class="page">

        <div class="reminder-form">

            <label>Что напомнить?</label>
            <input
                type="text"
                id="reminderText"
                placeholder="Например, сделать домашку"
            >

            <label>Дата</label>
            <input
                type="date"
                id="reminderDate"
            >

            <label>Время</label>
            <input
                type="time"
                id="reminderTime"
            >

            <button id="saveReminder">
                Создать напоминание
            </button>

        </div>

    </div>


    <!-- Мои напоминания -->
    <div id="remindersPage" class="page hidden">

        <div id="remindersList">
        </div>

    </div>

</div>

<script src="app.js"></script>

</body>
</html>
